name: Arabic Cards EXE

on:
  push:
    paths:
      - "arabic_cards/**"
      - ".github/workflows/arabic-cards-exe.yml"
  workflow_dispatch:

permissions:
  contents: write    # publishes the EXE as a release asset

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: arabic_cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ArabicCards main.py
      - name: Self-test the EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ArabicCards.exe -ArgumentList "selftest","$PWD\selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt -Encoding utf8 }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ArabicCards-windows
          path: arabic_cards/dist/ArabicCards.exe
      - name: Publish a direct download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arabic-cards-latest --cleanup-tag --yes || true
          gh release create arabic-cards-latest dist/ArabicCards.exe \
            --target "$GITHUB_SHA" --latest=false \
            --title "Arabic Cards for Windows" \
            --notes "Download ArabicCards.exe and double-click it. No installation needed."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            arabic_cards/selftest.txt
            arabic_cards/selftest.mp3
