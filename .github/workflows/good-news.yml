name: Daily good news to Telegram

# Started every morning at 08:00 Israel time by a Claude routine, which writes
# a Hebrew summary and passes it in as `message`. GitHub's own cron ran hours
# late, so there is no schedule here. Leave `message` empty to send the latest
# English headlines instead.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Ready-made message (Telegram HTML). Empty = latest headlines."
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send good news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ inputs.message }}
          FORCE_SEND: "1"
        run: python good_news_bot.py
