name: Tuner 4164 EXE

on:
  push:
    paths:
      - "tuner4164/**"
      - ".github/workflows/tuner4164-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tuner4164
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build EXE
        shell: bash
        run: |
          VER=$(python -c "from tune4164.version import __version__; print(__version__)")
          echo "VER=$VER" >> "$GITHUB_ENV"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Tuner4164-v$VER" run_tuner.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tuner4164-v${{ env.VER }}
          path: tuner4164/dist/Tuner4164-v${{ env.VER }}.exe
